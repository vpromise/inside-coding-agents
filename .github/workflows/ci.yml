name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-lab:
    name: Registry and Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.18,<5"

      - name: Scan tracked public artifacts
        run: python scripts/check_public_safety.py

      - name: Test repository safety rules
        run: python -m unittest discover -s scripts/tests -v

      - name: Check snapshot freshness window
        run: python scripts/check_freshness.py

      - name: Test reference curriculum
        run: python -m unittest discover -s curriculum/tests -v

      - name: Test experiment runner
        run: python -m unittest discover -s labs/tests -v

      - name: Rebuild experiment artifacts in memory
        run: python labs/runner.py reference-tool-roundtrip-v1 --check

      - name: Validate schemas, graph, digests, traces, and links
        run: python scripts/validate_registry.py

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Enforce time-bounded dependency audit policy
        run: npm run audit:ci

      - name: Verify generated content is current
        run: |
          npm run sync:content
          git diff --exit-code -- app/data public/data

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test every published route
        run: npm test

      - name: Build and test the GitHub Pages export
        run: npm run test:pages
